name: Release

# Builds standalone bundles when a tag v* is pushed, and attaches them to a
# GitHub Release. Nothing here runs on a pull request, and this workflow does
# not create the tag. A manual run (workflow_dispatch) builds the bundles as
# artifacts only and never publishes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the Windows setup exe (manual runs only; artifacts, no release)"
        required: false
        default: "0.0.0"

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      # The Linux runner's setup-python build is not linked against system Tk.
      # Use Ubuntu's Python, which is, so PyInstaller can bundle tkinter.
      - name: Linux Python with Tk
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-venv python3-pip python3-dev binutils
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/python" -m pip install -U pip
          "${RUNNER_TEMP}/venv/bin/python" -m pip install -r requirements.txt pyinstaller
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        if: runner.os != 'Linux'
        run: python -m pip install -U pip && python -m pip install -r requirements.txt pyinstaller

      - name: Tk imports
        shell: bash
        run: python -c "import tkinter, PIL, fontTools; print('tk', tkinter.TkVersion)"

      - name: NSIS (Windows setup exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v makensis >/dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            # community.chocolatey.org sometimes times out (504): retry
            for i in 1 2 3 4 5; do
              choco install nsis -y --no-progress && break
              echo "choco failed (attempt $i), retrying in 30 s"; sleep 30
            done
          fi
          ls "/c/Program Files (x86)/NSIS/makensis.exe" || command -v makensis

      - name: PyInstaller
        shell: bash
        env:
          VERSION: ${{ github.ref_type == 'tag' && '' || inputs.version }}
        run: bash packaging/pyinstaller.sh

      - name: Silent install / uninstall of the setup exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem packaging\out\SignMaker-*-setup-x64.exe | Select-Object -First 1
          if (-not $setup) { "::error::no setup exe was built"; exit 1 }
          "setup: $($setup.Name) $([math]::Round($setup.Length / 1MB, 1)) MB"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode) { "::error::setup exit $($p.ExitCode)"; exit 1 }
          $dir = "$env:ProgramFiles\Sign Maker"
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($f in 'SignMaker.exe', '_internal', 'LICENSE.txt', 'Uninstall.exe') {
            if (-not (Test-Path "$dir\$f")) { "::error::$f not installed"; exit 1 }
          }
          $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Sign Maker\Sign Maker.lnk"
          if (-not (Test-Path $lnk)) { "::error::Start Menu shortcut missing"; exit 1 }
          if (-not (Test-Path "$env:PUBLIC\Desktop\Sign Maker.lnk")) { "::error::desktop shortcut missing"; exit 1 }
          $u = Start-Process "$dir\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          Start-Sleep 5
          if (Test-Path "$dir\SignMaker.exe") { "::error::uninstall left the exe"; exit 1 }
          if (Test-Path $lnk) { "::error::uninstall left the Start Menu shortcut"; exit 1 }
          "install/uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: packaging/out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Checksums and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd bundles
          sha256sum SignMaker-* > SHA256SUMS.txt
          cat > NOTES.md << 'EOF'
          Sign Maker for SolidCraft, by Del (postmanpat).

          Unofficial community add-on. Not affiliated with or endorsed by the SolidCraft maintainers.
          SolidCraft is a separate install: https://github.com/tangency-labs/solidcraft/releases

          ### Windows (x64)
          **Installer:** run `SignMaker-<version>-setup-x64.exe`. It installs to `Program Files\Sign Maker` with a Start Menu shortcut, an optional desktop shortcut and an uninstaller (Settings > Apps). It asks for admin rights. The setup is unsigned, so SmartScreen may say "Windows protected your PC": choose **More info** then **Run anyway**.
          **Portable:** unzip `SignMaker-windows-x64.zip` and run `SignMaker.exe`. Leave the `_internal` folder beside the exe.

          ### macOS (Apple silicon, arm64)
          Unzip and open `Sign Maker.app`. The app is unsigned: the first time, right-click it and choose **Open**.
          This is not a universal2 binary. The GitHub macOS runner's Python is arm64-only, so an Intel + Apple silicon build is not produced. Intel Macs can run from source with `run.command`.

          ### Linux (x86_64)
          `tar -xzf SignMaker-linux-x86_64.tar.gz` then `./SignMaker/SignMaker`. Built on Ubuntu. aarch64: run from source with `run.sh`.

          macOS and Linux builds are new and community-tested. The author has tested Sign Maker on Windows.
          EOF
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" SignMaker-* SHA256SUMS.txt --clobber
          else
            gh release create "$tag" SignMaker-* SHA256SUMS.txt \
              --title "Sign Maker ${tag}" \
              --notes-file NOTES.md
          fi
